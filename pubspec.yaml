name: companio
description: Offline-first AI-assisted memory and cognitive wellness companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: 3.0.7
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  http: ^1.2.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  video_player: ^2.14.0
dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Variable.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Variable.ttf
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-Variable.ttf
    - family: NotoSansOriya
      fonts:
        - asset: assets/fonts/NotoSansOriya-Variable.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Variable.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Variable.ttf
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Variable.ttf
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Variable.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/NotoSansOlChiki-Variable.ttf
    - family: NotoSansMeeteiMayek
      fonts:
        - asset: assets/fonts/NotoSansMeeteiMayek-Variable.ttf
