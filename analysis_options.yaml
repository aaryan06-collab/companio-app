include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: false
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    avoid_print: true
    prefer_initializing_formals: false
    unnecessary_brace_in_string_interps: false